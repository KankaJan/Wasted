<svg xmlns="http://www.w3.org/2000/svg" width="780" height="780" viewBox="0 0 780 780" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <!-- backdrop -->
  <rect width="780" height="780" fill="#DADADA"/>
  <text x="390" y="34" text-anchor="middle" font-size="18" fill="#222" font-weight="bold">NextTimeEmail — UI mockup (not a compiled screenshot)</text>
  <text x="390" y="56" text-anchor="middle" font-size="12" fill="#555">light-gray surfaces · black text · dark-gray separators · outlined / thin-line icons</text>

  <!-- ================= ROSTER SCREEN ================= -->
  <g transform="translate(30,80)">
    <rect width="340" height="660" rx="22" fill="#F2F2F2" stroke="#555" stroke-width="1.5"/>
    <!-- app bar -->
    <text x="20" y="44" font-size="19" fill="#000" font-weight="bold">Who&#39;s in the meeting?</text>
    <!-- list icon -->
    <g stroke="#000" stroke-width="2" stroke-linecap="round">
      <line x1="296" y1="32" x2="316" y2="32"/><line x1="296" y1="40" x2="316" y2="40"/><line x1="296" y1="48" x2="316" y2="48"/>
    </g>
    <line x1="0" y1="64" x2="340" y2="64" stroke="#555" stroke-width="1"/>

    <!-- attendee card 1 -->
    <g transform="translate(16,82)">
      <rect width="308" height="68" rx="12" fill="#FAFAFA" stroke="#555" stroke-width="1.3"/>
      <text x="16" y="30" font-size="16" fill="#000" font-weight="bold">Alice Novak</text>
      <text x="16" y="50" font-size="12" fill="#444">alice@acme.com</text>
      <text x="292" y="40" text-anchor="end" font-size="14" fill="#000">$80 / Hourly</text>
    </g>
    <!-- attendee card 2 -->
    <g transform="translate(16,162)">
      <rect width="308" height="68" rx="12" fill="#FAFAFA" stroke="#555" stroke-width="1.3"/>
      <text x="16" y="30" font-size="16" fill="#000" font-weight="bold">Bob Svoboda</text>
      <text x="16" y="50" font-size="12" fill="#444">bob@acme.com</text>
      <text x="292" y="40" text-anchor="end" font-size="14" fill="#000">$640 / Man-day</text>
    </g>
    <!-- attendee card 3 -->
    <g transform="translate(16,242)">
      <rect width="308" height="68" rx="12" fill="#FAFAFA" stroke="#555" stroke-width="1.3"/>
      <text x="16" y="30" font-size="16" fill="#000" font-weight="bold">Carol Dvorak</text>
      <text x="16" y="50" font-size="12" fill="#444">carol@acme.com</text>
      <text x="292" y="40" text-anchor="end" font-size="14" fill="#000">$50 / Hourly</text>
    </g>

    <!-- start bar (outlined) -->
    <g transform="translate(16,360)">
      <rect width="308" height="280" rx="14" fill="#FAFAFA" stroke="#555" stroke-width="1.3"/>
      <text x="16" y="26" font-size="11" fill="#444" letter-spacing="0.5">TEAM BURN RATE</text>
      <text x="16" y="54" font-size="24" fill="#000" font-weight="bold">$210 / hour</text>

      <!-- currency field -->
      <g transform="translate(16,74)">
        <rect width="130" height="56" rx="8" fill="none" stroke="#555" stroke-width="1.3"/>
        <text x="10" y="-2" font-size="10" fill="#444" >Currency</text>
        <text x="14" y="34" font-size="15" fill="#000">USD</text>
      </g>
      <!-- buzz field with bell + suffix -->
      <g transform="translate(162,74)">
        <rect width="130" height="56" rx="8" fill="none" stroke="#555" stroke-width="1.3"/>
        <text x="2" y="-2" font-size="10" fill="#444">Buzz every</text>
        <!-- thin-line bell -->
        <g transform="translate(12,18)" stroke="#000" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9 a6 6 0 0 1 12 0 c0 5 2 6 3 8 H0 c1 -2 3 -3 3 -8 Z"/>
          <path d="M7 19 a2 2 0 0 0 4 0"/>
        </g>
        <text x="40" y="34" font-size="15" fill="#000">100</text>
        <text x="120" y="34" text-anchor="end" font-size="13" fill="#555">USD</text>
      </g>

      <!-- Start Meeting (outlined, neutral, play icon) -->
      <g transform="translate(16,150)">
        <rect width="276" height="48" rx="24" fill="none" stroke="#555" stroke-width="1.6"/>
        <polygon points="104,16 104,32 118,24" fill="#000"/>
        <text x="128" y="29" font-size="15" fill="#000" font-weight="600">Start Meeting</text>
      </g>
      <text x="16" y="232" font-size="11" fill="#555">Cost step, e.g. 100. Leave empty to turn off.</text>
    </g>

    <!-- FAB -->
    <g transform="translate(264,576)">
      <circle cx="28" cy="28" r="28" fill="#1A1A1A"/>
      <g stroke="#FFF" stroke-width="3" stroke-linecap="round"><line x1="28" y1="16" x2="28" y2="40"/><line x1="16" y1="28" x2="40" y2="28"/></g>
    </g>

    <text x="170" y="-10" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">Roster</text>
  </g>

  <!-- ================= LIVE MEETING SCREEN ================= -->
  <g transform="translate(410,80)">
    <rect width="340" height="660" rx="22" fill="#F2F2F2" stroke="#555" stroke-width="1.5"/>
    <!-- app bar -->
    <text x="20" y="44" font-size="19" fill="#000" font-weight="bold">Meeting in progress</text>
    <line x1="0" y1="64" x2="340" y2="64" stroke="#555" stroke-width="1"/>

    <text x="170" y="150" text-anchor="middle" font-size="13" fill="#444">3 attendees</text>

    <!-- bell + buzzes every -->
    <g transform="translate(118,170)">
      <g transform="translate(0,0)" stroke="#444" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 8 a6 6 0 0 1 12 0 c0 5 2 6 3 8 H0 c1 -2 3 -3 3 -8 Z"/>
        <path d="M7 17 a2 2 0 0 0 4 0"/>
      </g>
      <text x="26" y="14" font-size="13" fill="#444">Buzzes every $100.00</text>
    </g>

    <!-- big cost -->
    <text x="170" y="300" text-anchor="middle" font-size="52" fill="#000" font-weight="bold" font-family="Consolas, monospace">$184.20</text>

    <text x="170" y="362" text-anchor="middle" font-size="11" fill="#444" letter-spacing="0.5">ELAPSED</text>
    <text x="170" y="400" text-anchor="middle" font-size="28" fill="#000" font-family="Consolas, monospace">00:52:38</text>

    <!-- Pause (outlined) -->
    <g transform="translate(32,470)">
      <rect width="276" height="48" rx="24" fill="none" stroke="#555" stroke-width="1.6"/>
      <g transform="translate(96,16)" stroke="#000" stroke-width="3" stroke-linecap="round"><line x1="0" y1="0" x2="0" y2="16"/><line x1="8" y1="0" x2="8" y2="16"/></g>
      <text x="120" y="29" font-size="15" fill="#000" font-weight="600">Pause</text>
    </g>
    <!-- End (outlined, neutral — NOT red) -->
    <g transform="translate(32,532)">
      <rect width="276" height="48" rx="24" fill="none" stroke="#555" stroke-width="1.6"/>
      <rect x="96" y="16" width="16" height="16" rx="2" fill="#000"/>
      <text x="122" y="29" font-size="15" fill="#000" font-weight="600">End Meeting</text>
    </g>

    <text x="170" y="-10" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">Live meeting</text>
  </g>

  <!-- ================= NOTIFICATION MOCK ================= -->
  <g transform="translate(30,748)"></g>
</svg>
